name: Deploy

on:
  # Manual trigger — deploy langsung via workflow_dispatch.
  # Push ke main TIDAK auto-deploy; gunakan Actions → Deploy → Run workflow
  # untuk kontrol penuh. Tidak ada nilai env yang di-commit.
  workflow_dispatch:

# Semua nilai konfigurasi disuntik dari GitHub Secrets/Vars
# (Settings → Secrets and variables → Actions). Tidak ada nilai
# environment-specific yang di-commit ke repo.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # ── Worker & Domain ───────────────────────────────────────────────
  WORKER_NAME: ${{ vars.WORKER_NAME }}
  WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
  # Alternatif fallback jika pakai APP_DOMAIN:
  # WORKER_DOMAIN: ${{ secrets.APP_DOMAIN || vars.WORKER_DOMAIN }}
  ADDRESS_PREFIX: ${{ vars.ADDRESS_PREFIX }}
  DEFAULT_DOMAINS: ${{ vars.DEFAULT_DOMAINS }}
  DOMAINS: ${{ vars.DOMAINS }}
  DEFAULT_LANG: ${{ vars.DEFAULT_LANG }}
  WORKER_TITLE: ${{ vars.WORKER_TITLE }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL }}
  ENABLE_USER_CREATE_EMAIL: ${{ vars.ENABLE_USER_CREATE_EMAIL }}
  DISABLE_ANONYMOUS_USER_CREATE_EMAIL: ${{ vars.DISABLE_ANONYMOUS_USER_CREATE_EMAIL }}
  ENABLE_USER_DELETE_EMAIL: ${{ vars.ENABLE_USER_DELETE_EMAIL }}
  ENABLE_AI_EMAIL_EXTRACT: ${{ vars.ENABLE_AI_EMAIL_EXTRACT }}
  AI_EXTRACT_MODEL: ${{ vars.AI_EXTRACT_MODEL }}
  CF_TURNSTILE_SITE_KEY: ${{ vars.CF_TURNSTILE_SITE_KEY }}
  D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
  D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
  KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
  # ── Secrets (diisi dari Secrets, bukan Vars) ─────────────────────
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  ADMIN_PASSWORDS: ${{ secrets.ADMIN_PASSWORDS }}
  CF_TURNSTILE_SECRET_KEY: ${{ secrets.CF_TURNSTILE_SECRET_KEY }}
  TG_BOT_INFO: ${{ secrets.TG_BOT_INFO }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  RESEND_TOKEN: ${{ secrets.RESEND_TOKEN }}
  SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # pnpm-workspace: cache semua lockfile
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            worker/pnpm-lock.yaml

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.jsonc dari template + secrets
        run: pnpm cf:config

      - name: Typecheck
        run: pnpm check || echo "typecheck warning"

      - name: Build frontend + worker
        run: pnpm build

      - name: Put secrets ke Worker (jika diisi)
        run: |
          set -euo pipefail
          # Kumpulkan secrets yang ada ke JSON untuk bulk
          node -e '
            const fs=require("fs");
            const secrets={};
              for (const k of ["JWT_SECRET","ADMIN_PASSWORD","ADMIN_PASSWORDS","CF_TURNSTILE_SECRET_KEY","TG_BOT_INFO","TELEGRAM_BOT_TOKEN","RESEND_TOKEN","SMTP_CONFIG","S3_ENDPOINT","S3_ACCESS_KEY_ID","S3_SECRET_ACCESS_KEY"]) {
              if (process.env[k]) secrets[k]=process.env[k];
            }
            if (Object.keys(secrets).length) {
              fs.writeFileSync(".worker-secrets.json", JSON.stringify(secrets));
              console.log("Secrets to put:", Object.keys(secrets).join(", "));
            } else {
              console.log("No secrets to put");
            }
          '
          if [ -f .worker-secrets.json ]; then
            cat .worker-secrets.json | head -c 200; echo
            pnpm exec wrangler secret bulk .worker-secrets.json --config wrangler.jsonc
            rm -f .worker-secrets.json
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler.jsonc sudah digenerate; command default deploy
          # config sudah di wrangler.jsonc, tidak perlu wrangler.toml
