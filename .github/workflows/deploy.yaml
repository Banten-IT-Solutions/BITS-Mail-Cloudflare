name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
      ADDRESS_PREFIX: ${{ vars.ADDRESS_PREFIX }}
      DEFAULT_DOMAINS_TOML: ${{ vars.DEFAULT_DOMAINS_TOML }}
      DOMAINS_TOML: ${{ vars.DOMAINS_TOML }}
      DEFAULT_LANG: ${{ vars.DEFAULT_LANG }}
      WORKER_TITLE: ${{ vars.WORKER_TITLE }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      ENABLE_USER_CREATE_EMAIL: ${{ vars.ENABLE_USER_CREATE_EMAIL }}
      DISABLE_ANONYMOUS_USER_CREATE_EMAIL: ${{ vars.DISABLE_ANONYMOUS_USER_CREATE_EMAIL }}
      ENABLE_USER_DELETE_EMAIL: ${{ vars.ENABLE_USER_DELETE_EMAIL }}
      ENABLE_AI_EMAIL_EXTRACT: ${{ vars.ENABLE_AI_EMAIL_EXTRACT }}
      AI_EXTRACT_MODEL: ${{ vars.AI_EXTRACT_MODEL }}
      CF_TURNSTILE_SITE_KEY: ${{ vars.CF_TURNSTILE_SITE_KEY }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CF_TURNSTILE_SECRET_KEY: ${{ secrets.CF_TURNSTILE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            worker/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:pages

      - name: Deploy worker
        working-directory: worker
        run: |
          set -euo pipefail
          trap 'rm -f wrangler.toml .worker-secrets.json' EXIT

          node -e 'const fs=require("node:fs"); const env=process.env; const keys=["WORKER_NAME","WORKER_DOMAIN","ADDRESS_PREFIX","DEFAULT_DOMAINS_TOML","DOMAINS_TOML","DEFAULT_LANG","WORKER_TITLE","FRONTEND_URL","ENABLE_USER_CREATE_EMAIL","DISABLE_ANONYMOUS_USER_CREATE_EMAIL","ENABLE_USER_DELETE_EMAIL","ENABLE_AI_EMAIL_EXTRACT","AI_EXTRACT_MODEL","CF_TURNSTILE_SITE_KEY","D1_DATABASE_NAME","D1_DATABASE_ID","KV_NAMESPACE_ID"]; let text=fs.readFileSync("wrangler.toml.template","utf8"); for (const key of keys) { if (!env[key]) throw new Error(`Missing env ${key}`); text=text.replaceAll(`__${key}__`, env[key]); } fs.writeFileSync("wrangler.toml", text);'
          pnpm install --frozen-lockfile
          pnpm run deploy

          node -e 'require("node:fs").writeFileSync(".worker-secrets.json", JSON.stringify({ JWT_SECRET: process.env.JWT_SECRET, ADMIN_PASSWORD: process.env.ADMIN_PASSWORD, CF_TURNSTILE_SECRET_KEY: process.env.CF_TURNSTILE_SECRET_KEY }))'
          pnpm wrangler secret bulk .worker-secrets.json --name mail
